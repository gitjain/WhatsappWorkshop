# ═══════════════════════════════════════════════════════════════════════════
#                        NGINX LOAD BALANCER CONFIG
# ═══════════════════════════════════════════════════════════════════════════
#
# This is a SIMPLE load balancer configuration for learning purposes.
#
# WHAT IS A LOAD BALANCER?
# ========================
# Think of it like a receptionist at a busy office:
#   - Many people (requests) arrive at the front desk
#   - The receptionist decides which employee (server) handles each person
#   - This prevents any single employee from being overwhelmed
#
# HOW DOES IT WORK?
# =================
#   Client Request → NGINX (port 80) → Picks a server → Server responds
#                                   ↓
#                    Uses algorithm to choose which server
#
# ═══════════════════════════════════════════════════════════════════════════

# Worker processes - use auto to match CPU cores
worker_processes auto;

events {
    # Max simultaneous connections per worker
    worker_connections 1024;
}

http {
    # ═══════════════════════════════════════════════════════════════════════
    #                         UPSTREAM (Server Pool)
    # ═══════════════════════════════════════════════════════════════════════
    # This defines the GROUP of servers that will handle requests.
    # NGINX will distribute incoming requests across these servers.

    upstream backend_servers {
        # ───────────────────────────────────────────────────────────────────
        # LOAD BALANCING ALGORITHMS (uncomment ONE to try):
        # ───────────────────────────────────────────────────────────────────

        # 1. ROUND ROBIN (default) - Requests go 1→2→3→1→2→3...
        #    Good for: Servers with equal capacity
        #    (No directive needed, this is the default)

        # 2. LEAST CONNECTIONS - Send to server with fewest active connections
        #    Good for: Varying request durations (like our /api/slow endpoint)
        least_conn;

        # 3. IP HASH - Same client IP always goes to same server
        #    Good for: Session persistence (login stays on same server)
        # ip_hash;

        # 4. WEIGHTED - Some servers get more traffic than others
        #    Good for: Servers with different capacities
        #    (Add weight=X after each server, see examples below)

        # ───────────────────────────────────────────────────────────────────
        # SERVER LIST
        # ───────────────────────────────────────────────────────────────────
        # These are the actual backend servers
        # Format: server <hostname>:<port> [options];

        server server-1:3000;      # Server 1
        server server-2:3000;      # Server 2
        server server-3:3000;      # Server 3

        # WEIGHTED EXAMPLE (uncomment these instead of above to try):
        # server server-1:3000 weight=3;  # Gets 3x traffic
        # server server-2:3000 weight=2;  # Gets 2x traffic
        # server server-3:3000 weight=1;  # Gets 1x traffic

        # Keep connections alive for efficiency
        keepalive 32;
    }

    # ═══════════════════════════════════════════════════════════════════════
    #                         SERVER CONFIGURATION
    # ═══════════════════════════════════════════════════════════════════════

    server {
        # Listen on port 80 (standard HTTP)
        listen 80;

        # All requests go to our backend pool
        location / {
            # Forward to the upstream group
            proxy_pass http://backend_servers;

            # Pass original headers to backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Enable keep-alive connections
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
