# WhatsApp Clone - Complete Distributed Architecture
#
# INTERVIEW: This docker-compose demonstrates a production-like architecture:
# 1. NGINX Load Balancer → Distributes traffic across gateways
# 2. Multiple API Gateways → Horizontal scaling, high availability
# 3. RabbitMQ Message Queue → Async processing, reliability
# 4. Message Workers → Process queue, write to shards
# 5. Sharded Databases → Data partitioned by user ID
# 6. Redis Cache → Fast reads, reduced DB load
# 7. Database Replicas → Backup/failover capability

services:
  # ═══════════════════════════════════════════════════════════════════
  # LAYER 1: LOAD BALANCER (Entry Point)
  # ═══════════════════════════════════════════════════════════════════
  # INTERVIEW: "How do you handle millions of concurrent users?"
  # Answer: Load balancer distributes traffic, allows horizontal scaling

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: whatsapp-nginx
    ports:
      - "80:80"   # Main entry point for clients
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3
    networks:
      - whatsapp-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # LAYER 2: MESSAGE QUEUE (Async Processing)
  # ═══════════════════════════════════════════════════════════════════
  # INTERVIEW: "How do you handle traffic spikes?"
  # Answer: Queue absorbs bursts, workers process at steady rate

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: whatsapp-rabbitmq
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management UI (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # LAYER 3: API GATEWAYS (Multiple Instances for HA)
  # ═══════════════════════════════════════════════════════════════════
  # INTERVIEW: "What if a gateway crashes?"
  # Answer: Load balancer routes to healthy instances automatically

  gateway-1:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: whatsapp-gateway-1
    environment:
      PORT: 3000
      GATEWAY_ID: "1"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      shard-1:
        condition: service_started
      shard-2:
        condition: service_started
      shard-3:
        condition: service_started
    networks:
      - whatsapp-network
    restart: unless-stopped

  gateway-2:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: whatsapp-gateway-2
    environment:
      PORT: 3000
      GATEWAY_ID: "2"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      shard-1:
        condition: service_started
      shard-2:
        condition: service_started
      shard-3:
        condition: service_started
    networks:
      - whatsapp-network
    restart: unless-stopped

  gateway-3:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: whatsapp-gateway-3
    environment:
      PORT: 3000
      GATEWAY_ID: "3"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      shard-1:
        condition: service_started
      shard-2:
        condition: service_started
      shard-3:
        condition: service_started
    networks:
      - whatsapp-network
    restart: unless-stopped

  # Keep legacy gateway for direct access (debugging/testing)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: whatsapp-gateway
    ports:
      - "3000:3000"  # Direct access bypassing load balancer
    environment:
      PORT: 3000
      GATEWAY_ID: "0"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      shard-1:
        condition: service_started
      shard-2:
        condition: service_started
      shard-3:
        condition: service_started
    networks:
      - whatsapp-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # LAYER 4: MESSAGE WORKERS (Queue Consumers)
  # ═══════════════════════════════════════════════════════════════════
  # INTERVIEW: "How do you scale write throughput?"
  # Answer: Add more workers - they compete for queue messages

  worker-1:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: whatsapp-worker-1
    environment:
      WORKER_ID: "1"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      shard-1:
        condition: service_started
      shard-2:
        condition: service_started
      shard-3:
        condition: service_started
    networks:
      - whatsapp-network
    restart: unless-stopped

  worker-2:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: whatsapp-worker-2
    environment:
      WORKER_ID: "2"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      shard-1:
        condition: service_started
      shard-2:
        condition: service_started
      shard-3:
        condition: service_started
    networks:
      - whatsapp-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # LAYER 5: DATABASE SHARDS (Data Partitioning)
  # ═══════════════════════════════════════════════════════════════════
  # INTERVIEW: "How do you store billions of messages?"
  # Answer: Shard by user ID - each shard handles subset of users

  # ============= SHARD 1: Primary Database =============
  postgres-shard-1:
    image: postgres:15-alpine
    container_name: whatsapp-postgres-shard-1
    environment:
      POSTGRES_DB: whatsapp_shard_1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_shard_1_data:/var/lib/postgresql/data
      - ./postgres/shard-1-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp-network

  # SHARD 1: Backup Replica
  postgres-shard-1-backup:
    image: postgres:15-alpine
    container_name: whatsapp-postgres-shard-1-backup
    environment:
      POSTGRES_DB: whatsapp_shard_1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_shard_1_backup_data:/var/lib/postgresql/data
      - ./postgres/shard-1-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp-network

  # ============= SHARD 2: Primary Database =============
  postgres-shard-2:
    image: postgres:15-alpine
    container_name: whatsapp-postgres-shard-2
    environment:
      POSTGRES_DB: whatsapp_shard_2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_shard_2_data:/var/lib/postgresql/data
      - ./postgres/shard-2-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp-network

  # SHARD 2: Backup Replica
  postgres-shard-2-backup:
    image: postgres:15-alpine
    container_name: whatsapp-postgres-shard-2-backup
    environment:
      POSTGRES_DB: whatsapp_shard_2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_shard_2_backup_data:/var/lib/postgresql/data
      - ./postgres/shard-2-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp-network

  # ============= SHARD 3: Primary Database =============
  postgres-shard-3:
    image: postgres:15-alpine
    container_name: whatsapp-postgres-shard-3
    environment:
      POSTGRES_DB: whatsapp_shard_3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - postgres_shard_3_data:/var/lib/postgresql/data
      - ./postgres/shard-3-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp-network

  # SHARD 3: Backup Replica
  postgres-shard-3-backup:
    image: postgres:15-alpine
    container_name: whatsapp-postgres-shard-3-backup
    environment:
      POSTGRES_DB: whatsapp_shard_3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - postgres_shard_3_backup_data:/var/lib/postgresql/data
      - ./postgres/shard-3-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp-network

  # ═══════════════════════════════════════════════════════════════════
  # LAYER 6: REDIS CACHE (Fast Reads)
  # ═══════════════════════════════════════════════════════════════════
  # INTERVIEW: "How do you reduce database load?"
  # Answer: Cache frequently accessed data in Redis

  redis-shard-1:
    image: redis:7-alpine
    container_name: whatsapp-redis-shard-1
    ports:
      - "6379:6379"
    volumes:
      - redis_shard_1_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp-network

  redis-shard-2:
    image: redis:7-alpine
    container_name: whatsapp-redis-shard-2
    ports:
      - "6380:6379"
    volumes:
      - redis_shard_2_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp-network

  redis-shard-3:
    image: redis:7-alpine
    container_name: whatsapp-redis-shard-3
    ports:
      - "6381:6379"
    volumes:
      - redis_shard_3_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp-network

  # ═══════════════════════════════════════════════════════════════════
  # LAYER 7: SHARD SERVICES (Business Logic)
  # ═══════════════════════════════════════════════════════════════════

  shard-1:
    build:
      context: .
      dockerfile: ./shard-1/Dockerfile
    container_name: whatsapp-shard-1
    environment:
      SHARD_ID: "1"
      PORT: 4001
      REDIS_URL: redis://redis-shard-1:6379
      DB_HOST: postgres-shard-1
      DB_PORT: 5432
      DB_NAME: whatsapp_shard_1
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_BACKUP_HOST: postgres-shard-1-backup
      DB_BACKUP_PORT: 5432
    ports:
      - "4001:4001"
    depends_on:
      postgres-shard-1:
        condition: service_healthy
      postgres-shard-1-backup:
        condition: service_healthy
      redis-shard-1:
        condition: service_healthy
    networks:
      - whatsapp-network
    restart: unless-stopped

  shard-2:
    build:
      context: .
      dockerfile: ./shard-2/Dockerfile
    container_name: whatsapp-shard-2
    environment:
      SHARD_ID: "2"
      PORT: 4002
      REDIS_URL: redis://redis-shard-2:6379
      DB_HOST: postgres-shard-2
      DB_PORT: 5432
      DB_NAME: whatsapp_shard_2
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_BACKUP_HOST: postgres-shard-2-backup
      DB_BACKUP_PORT: 5432
    ports:
      - "4002:4002"
    depends_on:
      postgres-shard-2:
        condition: service_healthy
      postgres-shard-2-backup:
        condition: service_healthy
      redis-shard-2:
        condition: service_healthy
    networks:
      - whatsapp-network
    restart: unless-stopped

  shard-3:
    build:
      context: .
      dockerfile: ./shard-3/Dockerfile
    container_name: whatsapp-shard-3
    environment:
      SHARD_ID: "3"
      PORT: 4003
      REDIS_URL: redis://redis-shard-3:6379
      DB_HOST: postgres-shard-3
      DB_PORT: 5432
      DB_NAME: whatsapp_shard_3
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_BACKUP_HOST: postgres-shard-3-backup
      DB_BACKUP_PORT: 5432
    ports:
      - "4003:4003"
    depends_on:
      postgres-shard-3:
        condition: service_healthy
      postgres-shard-3-backup:
        condition: service_healthy
      redis-shard-3:
        condition: service_healthy
    networks:
      - whatsapp-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # CLIENT (Web UI)
  # ═══════════════════════════════════════════════════════════════════

  client:
    image: httpserver:latest
    container_name: whatsapp-client
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - gateway
    networks:
      - whatsapp-network
    restart: unless-stopped

# ═══════════════════════════════════════════════════════════════════
# VOLUMES (Persistent Storage)
# ═══════════════════════════════════════════════════════════════════

volumes:
  postgres_shard_1_data:
    driver: local
  postgres_shard_1_backup_data:
    driver: local
  postgres_shard_2_data:
    driver: local
  postgres_shard_2_backup_data:
    driver: local
  postgres_shard_3_data:
    driver: local
  postgres_shard_3_backup_data:
    driver: local
  redis_shard_1_data:
    driver: local
  redis_shard_2_data:
    driver: local
  redis_shard_3_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  whatsapp-network:
    driver: bridge
