# NGINX Load Balancer Configuration
#
# INTERVIEW NOTES:
# ================
# Q: Why use a load balancer?
# A: 1. Distributes traffic across multiple servers (horizontal scaling)
#    2. Provides high availability (if one server dies, others handle traffic)
#    3. Can do SSL termination, caching, rate limiting
#
# Q: What load balancing algorithms exist?
# A: - Round Robin (default): Requests go to servers in rotation
#    - Least Connections: Send to server with fewest active connections
#    - IP Hash: Same client IP always goes to same server (sticky sessions)
#    - Weighted: Some servers get more traffic than others

events {
    worker_connections 1024;
}

http {
    # Define the upstream cluster of gateway servers
    # INTERVIEW: This is where horizontal scaling happens
    upstream gateway_cluster {
        # Load balancing method: least_conn sends to server with fewest connections
        # Other options: (default round-robin), ip_hash, random
        least_conn;

        # Multiple gateway instances
        server gateway-1:3000 weight=1;
        server gateway-2:3000 weight=1;
        server gateway-3:3000 weight=1;

        # Health checks - NGINX will stop sending to unhealthy servers
        # keepalive maintains persistent connections (reduces latency)
        keepalive 32;
    }

    # Rate limiting - prevent abuse/DDoS
    # INTERVIEW: "How do you prevent API abuse?"
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # Logging for debugging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Health check endpoint for the load balancer itself
        location /nginx-health {
            return 200 'NGINX Load Balancer OK';
            add_header Content-Type text/plain;
        }

        # API routes - proxy to gateway cluster
        location /api/ {
            # Apply rate limiting
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://gateway_cluster;
            proxy_http_version 1.1;

            # Headers for proper proxying
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Connection keep-alive
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health endpoint
        location /health {
            proxy_pass http://gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # WebSocket support for real-time messaging
        # INTERVIEW: "How do you handle WebSocket with load balancers?"
        # A: Need to upgrade connection and use sticky sessions or broadcast
        location /ws {
            proxy_pass http://gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Longer timeouts for WebSocket
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
